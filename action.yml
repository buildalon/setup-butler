name: 'Buildalon Setup Butler'
description: A Github Action to setup the butler command line tools for itch.io content authoring.
branding:
  color: 'red'
  icon: 'terminal'
inputs:
  api-key:
    description: 'The API key for your itch.io account.'
    required: true
  version:
    description: 'The version of the butler CLI to install.'
    required: false
    default: 'latest'
outputs:
  path:
    description: 'The full path to the butler executable.'
  version:
    description: 'The installed butler version.'
runs:
  using: 'node24'
  main: 'dist/index.js'
  post: 'dist/index.js'
